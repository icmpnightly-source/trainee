# Builds the Android app (APK) from web/ with Capacitor and tries it on an
# Android emulator. Every push that touches the app uploads the APK as a build
# artifact; running it by hand with "release" ticked also publishes a GitHub
# release.
name: Android APK

on:
  push:
    paths:
      - "web/**"
      - "shared/**"
      - "server/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "APK'ni GitHub Release sifatida ham chiqarish"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Web app (with the pose model) into the Android project
        working-directory: web
        run: |
          npm ci
          npm run build
          npx cap sync android

      - name: Build the APK
        working-directory: web/android
        run: |
          ./gradlew assembleDebug --no-daemon --stacktrace
          mkdir -p ../../dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk "../../dist-apk/NormativAI-${VERSION_NAME}.apk"
          ls -la ../../dist-apk
          unzip -l "../../dist-apk/NormativAI-${VERSION_NAME}.apk" | grep -E "assets/public/(models|mediapipe)/"

      - uses: actions/upload-artifact@v4
        with:
          name: NormativAI-${{ env.VERSION_NAME }}-apk
          path: dist-apk/*.apk
          if-no-files-found: error

      # The APK on a real Android (emulator): first start, the server over the
      # native HTTP client, camera + pose model, GPS. Screenshots and logcat
      # go into the "smoke" artifact.
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test tools
        run: npm ci --prefix web/android/smoke --no-audit --no-fund

      - name: Smoke test on an Android 14 emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: bash web/android/smoke/run.sh dist-apk/NormativAI-${{ env.VERSION_NAME }}.apk smoke-out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ env.VERSION_NAME }}
          path: smoke-out/
          if-no-files-found: ignore

      - name: GitHub release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${VERSION_NAME}" dist-apk/*.apk \
            --target "${GITHUB_SHA}" \
            --title "NormativAI Android ${VERSION_NAME}" \
            --notes "Android ilova (debug imzoli APK). Telefonga o'rnatish: faylni yuklab oching, 'Noma'lum manbalardan o'rnatish'ga ruxsat bering."
